<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <header>
        <h1>💳 Credit Card Dashboard</h1>
        <div class="header-actions">
            <button id="btn-upload" class="btn btn-primary" onclick="showUpload()">Upload Statement</button>
            <span id="txn-count" class="badge"></span>
        </div>
    </header>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Upload Amex Statement</h2>
            <form id="upload-form" enctype="multipart/form-data">
                <input type="file" name="files" accept=".pdf" multiple required>
                <p class="hint">Select multiple PDFs to upload at once</p>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Upload & Parse</button>
                    <button type="button" class="btn btn-secondary" onclick="hideUpload()">Cancel</button>
                </div>
            </form>
            <div id="upload-status" class="status hidden"></div>
        </div>
    </div>

    <!-- PDF Viewer Modal -->
    <div id="pdf-modal" class="modal hidden">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h2 id="pdf-title">Statement PDF</h2>
                <button class="btn-close" onclick="hidePdf()">×</button>
            </div>
            <iframe id="pdf-viewer" src="" width="100%" height="600px"></iframe>
        </div>
    </div>

    <main>
        <!-- Date Range Filter -->
        <section class="filters">
            <label>From: <input type="date" id="filter-start"></label>
            <label>To: <input type="date" id="filter-end"></label>
            <button class="btn btn-small" onclick="applyFilters()">Apply</button>
            <button class="btn btn-small btn-secondary" onclick="clearFilters()">Clear</button>
        </section>

        <!-- Chart Section -->
        <section class="chart-section">
            <div class="chart-controls">
                <div class="toggle-group">
                    <button class="btn btn-small active" data-view="daily" onclick="switchView('daily')">Daily</button>
                    <button class="btn btn-small" data-view="monthly" onclick="switchView('monthly')">Monthly</button>
                </div>
                <div class="toggle-group">
                    <button class="btn btn-small active" data-chart="spending" onclick="switchChart('spending')">Spending</button>
                    <button class="btn btn-small" data-chart="category" onclick="switchChart('category')">By Category</button>
                    <button class="btn btn-small" data-chart="vendor" onclick="switchChart('vendor')">By Vendor</button>
                    <button class="btn btn-small" data-chart="points" onclick="switchChart('points')">Points</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="main-chart"></canvas>
            </div>
        </section>

        <!-- Vendor Rules Section -->
        <section class="rules-section">
            <div class="rules-header">
                <h2>Vendor Rules</h2>
                <button class="btn btn-small" onclick="toggleRules()"><span id="rules-toggle">Show</span></button>
            </div>
            <div id="rules-panel" class="rules-panel hidden">
                <div class="rules-add">
                    <input id="rule-pattern" placeholder="Pattern (e.g. AMZN MKTP)" class="rule-input">
                    <input id="rule-vendor" placeholder="Vendor (e.g. Amazon)" class="rule-input">
                    <select id="rule-category" class="rule-input"></select>
                    <button class="btn btn-small btn-primary" onclick="addRule()">Add Rule</button>
                </div>
                <div class="rule-row rule-header-row">
                    <span class="rule-pattern"><strong>Pattern</strong></span>
                    <span class="rule-vendor"><strong>Vendor</strong></span>
                    <span class="rule-cat"><strong>Category</strong></span>
                    <span class="rule-actions"><strong>Actions</strong></span>
                </div>
                <div id="rules-list"></div>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="categories-section">
            <div class="rules-header">
                <h2>Categories</h2>
                <button class="btn btn-small" onclick="toggleCategories()"><span id="cats-toggle">Show</span></button>
            </div>
            <div id="cats-panel" class="rules-panel hidden">
                <div class="rules-add">
                    <input id="new-cat-name" placeholder="New category name" class="rule-input">
                    <button class="btn btn-small btn-primary" onclick="addCategory()">Add</button>
                </div>
                <div id="cats-list"></div>
            </div>
        </section>

        <!-- Vendor Rule Edit Modal -->
        <div id="vendor-modal" class="modal hidden">
            <div class="modal-content modal-sm">
                <div class="modal-header">
                    <h3 id="vendor-modal-title">Add Vendor Rule</h3>
                    <button class="btn-close" onclick="hideVendorModal()">&times;</button>
                </div>
                <form id="vendor-form" onsubmit="submitVendorModal(event)">
                    <label>Pattern (substring to match)
                        <input id="vm-pattern" type="text" required placeholder="e.g. AMZN MKTP">
                    </label>
                    <label>Vendor name
                        <input id="vm-vendor" type="text" required placeholder="e.g. Amazon">
                    </label>
                    <label>Category
                        <select id="vm-category"></select>
                    </label>
                    <input id="vm-old-pattern" type="hidden">
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="hideVendorModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Transactions Table -->
        <section class="table-section">
            <div class="table-header">
                <h2>Transactions <span id="table-count"></span></h2>
                <div class="table-controls">
                    <label class="raw-toggle">
                        <input type="checkbox" id="show-raw-desc" onchange="toggleRawDesc()"> Raw Description
                    </label>
                    <div class="toggle-group">
                        <button class="btn btn-small active" data-tview="all" onclick="switchTableView('all')">All</button>
                        <button class="btn btn-small" data-tview="monthly" onclick="switchTableView('monthly')">By Month</button>
                    </div>
                    <select id="month-select" class="month-select hidden" onchange="filterByMonth(this.value)"></select>
                </div>
            </div>
            <div class="table-scroll">
                <table id="txn-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="transaction_date">Date <span class="sort-arrow">↕</span></th>
                            <th class="sortable" data-sort="vendor">Vendor <span class="sort-arrow">↕</span></th>
                            <th class="sortable raw-col hidden" data-sort="description">Raw Description <span class="sort-arrow">↕</span></th>
                            <th class="sortable" data-sort="cardholder">Cardholder <span class="sort-arrow">↕</span></th>
                            <th class="sortable num" data-sort="amount">Amount <span class="sort-arrow">↕</span></th>
                            <th class="sortable num" data-sort="points">Points <span class="sort-arrow">↕</span></th>
                            <th class="sortable" data-sort="category">Category <span class="sort-arrow">↕</span></th>
                            <th class="sortable" data-sort="points_category">Points Cat <span class="sort-arrow">↕</span></th>
                            <th>Card</th>
                        </tr>
                    </thead>
                    <tbody id="txn-body"></tbody>
                </table>
            </div>
        </section>

        <!-- Statements List -->
        <section class="statements-section">
            <h2>Statements</h2>
            <div id="statements-list"></div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
